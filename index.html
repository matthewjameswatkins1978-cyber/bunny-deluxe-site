<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dc9615">
  <meta name="description" content="Bunny Deluxe. Coming soon.">
  <title>Bunny Deluxe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐇%3C/text%3E%3C/svg%3E">
  <style>
    :root{--mustard:#dc9615;--ink:#090806;--red:#ef3d2f}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--mustard);overflow:hidden}
    body{color:var(--ink)}
    main{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 15% 20%,rgba(255,215,90,.13),transparent 24rem),radial-gradient(circle at 85% 75%,rgba(110,55,0,.08),transparent 28rem),var(--mustard);isolation:isolate}
    .art{width:100%;height:100%;object-fit:cover;object-position:center;display:block;filter:saturate(1.04) contrast(1.02);animation:alive 9s ease-in-out infinite alternate}
    .grain{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.015) 0 1px,transparent 1px 4px);mix-blend-mode:multiply;opacity:.45}
    .spark{position:absolute;width:.55rem;height:.55rem;opacity:.42;animation:drift var(--t) ease-in-out infinite alternate;pointer-events:none}
    .spark:before,.spark:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#111;transform:rotate(var(--r))}
    .spark:after{transform:rotate(calc(var(--r) + 90deg))}
    .spark.red:before,.spark.red:after{background:var(--red);box-shadow:0 0 .75rem rgba(239,61,47,.55)}
    .s1{left:6%;top:16%;--t:7s;--r:15deg}.s2{right:7%;top:24%;--t:9s;--r:32deg}.s3{left:10%;bottom:15%;--t:8s;--r:-12deg}.s4{right:12%;bottom:18%;--t:10s;--r:5deg}.s5{left:4%;top:57%;--t:11s;--r:42deg}
    .sig{position:absolute;right:clamp(.6rem,2vw,1.5rem);bottom:clamp(.55rem,1.8vw,1.25rem);font:700 11px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.28;user-select:none}
    @keyframes alive{from{transform:scale(1.005) translate3d(-.1%,0,0)}to{transform:scale(1.018) translate3d(.1%,-.1%,0)}}
    @keyframes drift{from{transform:translateY(-4px) rotate(-8deg);opacity:.22}to{transform:translateY(5px) rotate(8deg);opacity:.55}}
    @media (max-aspect-ratio:4/5){.art{object-fit:contain;animation:phoneAlive 9s ease-in-out infinite alternate}.sig{display:none}@keyframes phoneAlive{from{transform:scale(.985)}to{transform:scale(1)}}}
    @media (prefers-reduced-motion:reduce){.art,.spark{animation:none}}
  </style>
</head>
